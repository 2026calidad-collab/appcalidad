<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stickers QR Cebaderos</title>
<style>
  body{font-family:system-ui,sans-serif;margin:16px;color:#111;background:#fff}
  .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
  .ctl label{display:flex;flex-direction:column;font-size:13px;gap:4px}
  .ctl input{padding:8px;font-size:15px;width:110px}
  button{padding:10px 14px;font-size:15px;font-weight:700;background:#4f7a22;color:#fff;border:0;border-radius:8px;cursor:pointer}
  .hoja{display:grid;grid-template-columns:repeat(4,1fr);gap:6mm}
  .et{border:1px dashed #999;padding:3mm;text-align:center;break-inside:avoid;page-break-inside:avoid}
  .et .n{font-size:22px;font-weight:800;font-family:ui-monospace,monospace;margin-top:2mm}
  .et .z{font-size:10px;color:#444}
  .et .c{font-size:9px;color:#666}
  .et canvas,.et img{margin:0 auto;display:block}
  @media print{.ctl,.ayuda{display:none}body{margin:8mm}}
</style>
</head>
<body>
<div class="ctl">
  <label>Desde N°<input type="number" id="a" value="1" min="1"></label>
  <label>Hasta N°<input type="number" id="b" value="186" min="1"></label>
  <button id="gen">Generar</button>
  <button id="imp">Imprimir</button>
</div>
<p class="ayuda" style="font-size:13px;color:#555;max-width:70ch">Cada QR abre la app directamente en ese cebadero (también con la cámara normal del celular). Imprime en papel adhesivo y plastifica o cubre con cinta transparente para que resista el lavado.</p>
<div class="hoja" id="hoja"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
const C=window.CONFIG,F=C.formatos['FT-17'];
// Usa las listas editadas desde "Administrar listas" (guardadas en este navegador) o, si no hay, las de config.js
let LS={};C.catalogo.forEach(d=>LS[d.id]=d.items?d.items.map(x=>Array.isArray(x)?{c:String(x[0]),v:String(x[1]),on:true}:{c:'',v:String(x),on:true}):[{v:String(d.valor),on:true}]);
try{const r=JSON.parse(localStorage.getItem('pdc_listas')||'null');if(r&&r.listas)Object.values(r.listas).forEach(l=>LS[l.id]=l.items)}catch(e){}
const act=id=>(LS[id]||[]).filter(x=>x.on);
const TOTAL=Number((act('ft17.total')[0]||{}).v)||186;
function zonaDe(n){for(const z of act('ft17.zonas')){const [a,b]=z.c.split('-').map(Number);if(n>=a&&n<=(b||a))return z.v}return ''}
document.getElementById('b').value=TOTAL;
const base=location.href.replace(/qr\.html.*$/,'index.html');
function gen(){
  const a=+document.getElementById('a').value||1,b=Math.min(+document.getElementById('b').value||TOTAL,TOTAL);
  const h=document.getElementById('hoja');h.innerHTML='';
  for(let i=a;i<=b;i++){
    const d=document.createElement('div');d.className='et';
    d.innerHTML=`<div class="q"></div><div class="n">CEB ${i}</div><div class="z">${zonaDe(i)}</div><div class="c">${F.codigo} · ${C.empresa}</div>`;
    h.appendChild(d);
    new QRCode(d.querySelector('.q'),{text:base+'?ceb='+i,width:110,height:110,correctLevel:QRCode.CorrectLevel.M});
  }
}
document.getElementById('gen').onclick=gen;
document.getElementById('imp').onclick=()=>window.print();
gen();
</script>
</body>
</html>
